<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="Dimensionnez panneaux solaires et batterie sur votre consommation réelle, comparez les devis et leur rentabilité. Tout est calculé dans votre navigateur."
		/>
		<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<script>
			// thème avant le premier affichage (pas de flash)
			try {
				const t = localStorage.getItem('justewatt.theme');
				const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
